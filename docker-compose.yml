services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/devpassword
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://rag:devpassword@postgres:5432/rag
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_API_BASE: http://host.docker.internal:11434
    ports: ["8000:8000"]
    depends_on: [qdrant, postgres, neo4j]
volumes:
  qdrant_data:
  postgres_data:
  neo4j_data:
